<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LLM Wiki UI Harness</title>
    <style>
      :root {
        --bg: oklch(0.165 0.006 268);
        --bg-2: oklch(0.2 0.007 268);
        --bg-3: oklch(0.24 0.008 268);
        --line: oklch(0.31 0.009 268);
        --line-strong: oklch(0.6 0.012 268);
        --ink: oklch(0.962 0.004 268);
        --ink-3: oklch(0.715 0.01 268);
        --accent: oklch(0.73 0.145 277);
        --accent-ink: oklch(0.17 0.02 277);
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
      }

      /* Minimal Tailwind utility shim — supports just the classes used by the */
      /* plugin's WikiRouteSidebar so the screenshot harness renders something */
      /* visually close to the production host (which compiles real Tailwind). */
      .w-60 { width: 15rem; }
      .h-full { height: 100%; }
      .min-h-0 { min-height: 0; }
      .border-r { border-right-width: 1px; border-right-style: solid; }
      .border-t { border-top-width: 1px; border-top-style: solid; }
      .border-line { border-color: var(--line); }
      .bg-bg { background: var(--bg); }
      .bg-bg-3 { background: var(--bg-3); }
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-1 { flex: 1; }
      .items-center { align-items: center; }
      .gap-0\.5 { gap: 0.125rem; }
      .gap-1 { gap: 0.25rem; }
      .gap-1\.5 { gap: 0.375rem; }
      .gap-2 { gap: 0.5rem; }
      .gap-2\.5 { gap: 0.625rem; }
      .mb-2 { margin-bottom: 0.5rem; }
      .mb-3 { margin-bottom: 0.75rem; }
      .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
      .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
      .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
      .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .shrink-0 { flex-shrink: 0; }
      .text-xs { font-size: 0.75rem; line-height: 1rem; }
      .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
      .text-\[11px\] { font-size: 11px; }
      .text-\[13px\] { font-size: 13px; }
      .font-medium { font-weight: 500; }
      .font-semibold { font-weight: 600; }
      .font-bold { font-weight: 700; }
      .uppercase { text-transform: uppercase; }
      .tracking-normal { letter-spacing: 0; }
      .text-ink { color: var(--ink); }
      .text-ink\/80 { color: color-mix(in oklab, var(--ink) 80%, transparent); }
      .text-ink-3 { color: var(--ink-3); }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rounded-md { border-radius: 0.375rem; }
      .transition-colors { transition: background-color 150ms, color 150ms; }
      .overflow-y-auto { overflow-y: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
