    {
      "id": "mcp:wardmoteUpdateIssue",
      "name": "wardmoteUpdateIssue",
      "description": "Patch an issue, optionally including a comment; include resume=true when intentionally requesting follow-up on resumable closed work. Agents cannot hand their own task to a reviewer: executionPolicy.stages in advanced is board-controlled, a handoff started by agent-authored stages is rejected with 422 agent_review_handoff_requires_subtask, and changing assigneeAgentId or assigneeUserId on the task you are assigned is rejected with 422 agent_reassign_requires_subtask (returning the issue to its creator user is still allowed). To get your work reviewed, create a review subtask with wardmoteCreateChildIssue assigned to the reviewer with a self-contained description, add its id to blockedByIssueIds on your issue, then set status to in_review: you stay the assignee and the issue_blockers_resolved wake brings you the verdict. Schedule a timed re-check (the issue monitor) with advanced.executionPolicy.monitor.nextCheckAt; executionPolicy replaces the stored policy as a whole.",
      "sourceKind": "legacy_mcp_alias",
      "sourceAnchor": "packages/mcp-server/src/tools.ts:671",
      "expectedSemantics": "Patch an issue, optionally including a comment; include resume=true when intentionally requesting follow-up on resumable closed work. Agents cannot hand their own task to a reviewer: executionPolicy.stages in advanced is board-controlled, a handoff started by agent-authored stages is rejected with 422 agent_review_handoff_requires_subtask, and changing assigneeAgentId or assigneeUserId on the task you are assigned is rejected with 422 agent_reassign_requires_subtask (returning the issue to its creator user is still allowed). To get your work reviewed, create a review subtask with wardmoteCreateChildIssue on your issue with reviewOfParent: true, assigned to the reviewer, with a self-contained description (reviewOfParent adds it to blockedByIssueIds on your issue and is allowed even when the reviewer created an open ancestor), then set status to in_review: you stay the assignee and the issue_blockers_resolved wake brings you the verdict. Schedule a timed re-check (the issue monitor) with advanced.executionPolicy.monitor.nextCheckAt; executionPolicy replaces the stored policy as a whole.",
