      "id": "mcp:wardmoteAddComment",
      "name": "wardmoteAddComment",
      "description": "Add a comment to an issue; include resume=true when intentionally requesting follow-up on resumable closed work. A message you post on another agent's task steers into that agent's running turn by default, so it is read immediately instead of after the turn; set deliver to queue when it must wait for the current turn to finish, or to steer to override an instance default of queue. Comments on your own assigned task always wait for your next turn. The response reports the disposition, with deliveredAs as queued or steered, and steeringUnavailable naming why whenever deliveredAs is queued: not_requested when no steer was needed (queue was asked for, or the default steer found no running turn), identity_mismatch when the message answers to a different user than the running turn does, board_only when the author cannot steer that run at all, and otherwise no_active_run, legacy_protocol, conversation_order or steering_failed.",
