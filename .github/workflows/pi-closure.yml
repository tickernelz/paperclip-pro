name: Pi closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pi-closure.yml"
      - "patches/pi-acp@*.patch"
      - "patches/brace-expansion@*.patch"
      - "packages/wardmote-runner/scripts/materialize-pi-distribution.mjs"
      - "packages/wardmote-runner/scripts/pi-distribution/**"
      - "packages/wardmote-runner/src/drivers/acpx/pi-*.ts"

permissions:
  contents: read

jobs:
  materialize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize the pinned Pi distribution
        run: node packages/wardmote-runner/scripts/materialize-pi-distribution.mjs "$RUNNER_TEMP/pi"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pi-native-closure-${{ matrix.target }}
          path: ${{ runner.temp }}/pi/native-closure.json
          if-no-files-found: ignore
