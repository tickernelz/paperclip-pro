name: Pi closure

on:
  workflow_dispatch:
  push:
    branches:
      - "chore/zha5833-pi-closure*"

permissions:
  contents: read

jobs:
  materialize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Materialize the pinned Pi distribution
        run: node packages/wardmote-runner/scripts/materialize-pi-distribution.mjs "$RUNNER_TEMP/pi"
      - name: Report the native closure digest
        if: always()
        run: |
          test -f "$RUNNER_TEMP/pi/native-closure.json" || exit 0
          node -e 'const {createHash}=require("node:crypto");const {entries}=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));console.log(process.argv[2], createHash("sha256").update(JSON.stringify(entries)).digest("hex"))' "$RUNNER_TEMP/pi/native-closure.json" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-native-closure-${{ matrix.target }}
          path: ${{ runner.temp }}/pi/native-closure.json
          if-no-files-found: ignore
