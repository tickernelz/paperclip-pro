name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version as YYYY.MDD.P. Empty resolves today's UTC slot and the next free patch.
        required: false
        type: string
      dry_run:
        description: Preview the release without publishing
        required: true
        type: boolean
        default: false
      auth:
        description: npm authentication (token until every package has a trusted publisher)
        required: true
        type: choice
        options:
          - token
          - oidc
        default: token

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

env:
  NPM_PUBLISH_VERIFY_ATTEMPTS: "180"
  NPM_PUBLISH_VERIFY_DELAY_SECONDS: "10"

jobs:
  release:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve release parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_AUTH: ${{ inputs.auth }}
        run: ./scripts/release-tag-gate.sh resolve >> "$GITHUB_OUTPUT"

      - name: Require the tagged commit on main
        if: github.event_name == 'push'
        run: ./scripts/release-tag-gate.sh require-main-ancestor "$(git rev-parse HEAD)"

      - name: Require green CI on the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-tag-gate.sh require-green-ci "${{ github.repository }}" "$(git rev-parse HEAD)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the runner crate build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/paperclip-runner/runner/target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('packages/paperclip-runner/runner/Cargo.lock') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ steps.params.outputs.auth == 'token' && secrets.NPM_TOKEN || '' }}
          RELEASE_VERSION: ${{ steps.params.outputs.version }}
          RELEASE_DRY_RUN: ${{ steps.params.outputs.dry_run }}
        run: |
          args=()
          if [ -n "$RELEASE_VERSION" ]; then
            args+=(--version "$RELEASE_VERSION")
          fi
          if [ "$RELEASE_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          ./scripts/release.sh "${args[@]+"${args[@]}"}"

      - name: Dump npm debug logs
        if: failure()
        run: |
          shopt -s nullglob
          for f in "$HOME"/.npm/_logs/*.log; do
            echo "===== $f ====="
            tail -n 300 "$f" | sed -E \
              -e 's#((authorization|_authToken|_auth|node_auth_token|npm_token)"?[[:space:]]*[:=][[:space:]]*"?)(Bearer[[:space:]]+)?[^",[:space:]]+#\1***REDACTED***#Ig'
          done
