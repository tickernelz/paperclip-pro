name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version as YYYY.MDD.P. Empty resolves today's UTC slot and the next free patch.
        required: false
        type: string
      dry_run:
        description: Preview the release without publishing
        required: true
        type: boolean
        default: false
      auth:
        description: npm authentication (token until every package has a trusted publisher)
        required: true
        type: choice
        options:
          - token
          - oidc
        default: token

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  NPM_PUBLISH_VERIFY_ATTEMPTS: "180"
  NPM_PUBLISH_VERIFY_DELAY_SECONDS: "10"

jobs:
  release:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ inputs.auth == 'token' && secrets.NPM_TOKEN || '' }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$RELEASE_VERSION" ]; then
            args+=(--version "$RELEASE_VERSION")
          fi
          if [ "$RELEASE_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          ./scripts/release.sh "${args[@]+"${args[@]}"}"

      - name: Dump npm debug logs
        if: failure()
        run: |
          shopt -s nullglob
          for f in "$HOME"/.npm/_logs/*.log; do
            echo "===== $f ====="
            tail -n 300 "$f" | sed -E \
              -e 's#((authorization|_authToken|_auth|node_auth_token|npm_token)"?[[:space:]]*[:=][[:space:]]*"?)(Bearer[[:space:]]+)?[^",[:space:]]+#\1***REDACTED***#Ig'
          done
