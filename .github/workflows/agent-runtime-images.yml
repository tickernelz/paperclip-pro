name: agent-runtime-images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/agent-runtime-images.yml"
      - "docker/agent-runtime/**"
      - "tools/agent-shim/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-runtime-images.yml"
      - "docker/agent-runtime/**"
      - "tools/agent-shim/**"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the agent runtime images
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: v1
        run: docker buildx bake -f docker/agent-runtime/buildx-bake.hcl

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the agent runtime images
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: v1
        run: docker buildx bake -f docker/agent-runtime/buildx-bake.hcl --push
