name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy, browser extensions, Docker OMP pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/policy-checks

      - name: Check the bundled OMP matches the pin
        if: ${{ !cancelled() }}
        run: bash scripts/check-docker-omp-pin.sh Dockerfile

      - name: Check the shared protocol contract is current
        if: ${{ !cancelled() }}
        run: node scripts/generate-local-browser-protocol.mjs --check
      - name: Check the synced extension copies match apps/local-browser/shared
        if: ${{ !cancelled() }}
        run: node scripts/sync-local-browser-shared.mjs --check
      - name: Check every extension script parses
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          find apps/local-browser -name '*.js' -o -name '*.mjs' | while read -r file; do
            node --check "$file"
          done
      - name: Run the extension suites
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test apps/local-browser/shared/lib/*.test.mjs
          node --test apps/local-browser/chromium/lib/*.test.mjs apps/local-browser/chromium/background/*.test.mjs
          node --test apps/local-browser/firefox/lib/*.test.mjs
      - name: Check the download artifacts match the source
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/check-local-browser-artifacts.mjs
          test -s ui/public/downloads/local-browser-firefox.xpi || {
            echo "ui/public/downloads/local-browser-firefox.xpi is missing."
            exit 1
          }
          unzip -p ui/public/downloads/local-browser-firefox.xpi manifest.json > /dev/null || {
            echo "ui/public/downloads/local-browser-firefox.xpi is not a readable add-on."
            exit 1
          }

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Runner Rust release cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages/wardmote-runner/runner -> target
          shared-key: runner-typecheck-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Typecheck workspaces whose build scripts skip TypeScript
        run: pnpm run typecheck:build-gaps

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          save-store: "true"
      - name: Build Runner Evalbook viewer
        run: pnpm --filter @tickernelz/wardmote-runner build:issue-thread
      - name: Runner Rust release cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages/wardmote-runner/runner -> target
          shared-key: runner-build-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build
        run: pnpm build

  runner:
    name: Verify Wardmote Runner (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [checks, suites]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Select the pinned Runner Rust toolchain
        working-directory: packages/wardmote-runner
        run: |
          set -uo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo '::notice title=Runner Rust cache::rustup is unavailable; building with the image default toolchain'
            exit 0
          fi
          rustup show
          toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          extra_toolchains="$(rustup toolchain list | awk '{print $1}' | grep -vx "$toolchain" || true)"
          if [ -n "$extra_toolchains" ]; then
            echo "$extra_toolchains" | xargs -n1 rustup toolchain uninstall \
              || echo '::notice title=Runner Rust cache::could not remove an extra toolchain; the cache key may not match'
          fi
          rustup toolchain list

      - name: Runner Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages/wardmote-runner/runner -> target
          shared-key: runner-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Static checks
        if: matrix.part == 'checks'
        run: pnpm --filter @tickernelz/wardmote-runner check:static

      - name: Rust checks
        if: matrix.part == 'checks'
        run: pnpm --filter @tickernelz/wardmote-runner check:runner

      - name: Reserve the credential lease port range from ephemeral allocation
        if: matrix.part == 'suites'
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=49152-65535
          sysctl net.ipv4.ip_local_port_range net.ipv4.ip_local_reserved_ports

      - name: TypeScript suites
        if: matrix.part == 'suites'
        run: pnpm --filter @tickernelz/wardmote-runner test:typescript:vitest

  general:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: general-server-without-chat
            label: server 1/6
            shard_index: 0
            shard_count: 6
          - group: general-server-without-chat
            label: server 2/6
            shard_index: 1
            shard_count: 6
          - group: general-server-without-chat
            label: server 3/6
            shard_index: 2
            shard_count: 6
          - group: general-server-without-chat
            label: server 4/6
            shard_index: 3
            shard_count: 6
          - group: general-server-without-chat
            label: server 5/6
            shard_index: 4
            shard_count: 6
          - group: general-server-without-chat
            label: server 6/6
            shard_index: 5
            shard_count: 6
          - group: general-chat
            label: chat 1/2
            shard_index: 0
            shard_count: 2
          - group: general-chat
            label: chat 2/2
            shard_index: 1
            shard_count: 2
          - group: general-workspaces-a
            label: workspaces-a 1/2
            shard_index: 0
            shard_count: 2
          - group: general-workspaces-a
            label: workspaces-a 2/2
            shard_index: 1
            shard_count: 2
          - group: general-workspaces-b
            label: workspaces-b
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Run grouped test suites
        env:
          WARDMOTE_SERVER_TEST_WORKERS: "3"
        run: |
          echo "runner: $(nproc) CPU, $(free -g | awk '/^Mem:/ {print $2}') GiB RAM"
          if [ -n "${{ matrix.shard_count }}" ]; then
            pnpm test:run:general -- --group '${{ matrix.group }}' \
              --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general -- --group '${{ matrix.group }}'
          fi

  serialized:
    name: Tests (serialized ${{ matrix.shard_index }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Run serialized server test shard
        env:
          WARDMOTE_SERVER_TEST_WORKERS: "3"
        run: pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count 3

  runner-e2e-unit:
    name: Runner E2E support suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Run the Runner E2E support suites
        run: pnpm test:e2e:runner:unit

  e2e:
    name: E2E (${{ matrix.shard_index }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Verify runner Chrome
        run: google-chrome --version

      - name: Generate Wardmote config
        run: |
          mkdir -p ~/.wardmote/instances/default
          cat > ~/.wardmote/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      - name: Run e2e tests
        env:
          WARDMOTE_E2E_SKIP_LLM: "true"
          WARDMOTE_PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          specs="$(node ./scripts/e2e-shard.mjs --shard-index ${{ matrix.shard_index }} --shard-count 5)"
          echo "shard ${{ matrix.shard_index }} specs: $specs"
          # shellcheck disable=SC2086
          pnpm run test:e2e $specs

      - name: Upload onboarding screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: onboarding-shots-${{ matrix.shard_index }}
          path: tests/e2e/test-results/onboarding-shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard_index }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

  browser-gates:
    name: Mobile shell (WebKit) and contrast gate (rendered colours)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      BROWSER_GATES_IMAGE: ghcr.io/tickernelz/wardmote/browser-gates@sha256:6f8e3d84c3cf27421f7dc8e2e5ddf89d59594fec1debc1d1c8fd23ecd2202666
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Resolve the Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Pull the browser gates image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_VERSION: ${{ steps.playwright-version.outputs.version }}
        run: |
          ready=false
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null || true
          for attempt in 1 2 3; do
            if docker pull --quiet "$BROWSER_GATES_IMAGE" >/dev/null; then
              image_version="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$BROWSER_GATES_IMAGE" | sed -n 's/^PLAYWRIGHT_VERSION=//p')"
              if [ "$image_version" = "$PLAYWRIGHT_VERSION" ]; then
                ready=true
              else
                echo "::warning title=Browser gates image::image has Playwright $image_version, the lockfile has $PLAYWRIGHT_VERSION; rebuild .github/browser-gates.Dockerfile and pin the new digest. Installing on the runner instead."
              fi
              break
            fi
            [ "$attempt" = 3 ] || sleep $((attempt * 10))
          done
          if [ "$ready" != true ] && [ -z "${image_version:-}" ]; then
            echo "::warning title=Browser gates image::could not pull $BROWSER_GATES_IMAGE; installing on the runner instead."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers and system packages
        id: playwright-cache
        if: steps.image.outputs.ready != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright-version.outputs.version }}-webkit-chromium

      - name: Install WebKit and Chromium
        if: steps.image.outputs.ready != 'true'
        timeout-minutes: 15
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$HOME/.cache/playwright-apt/partial"
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/playwright-apt" | sudo tee /etc/apt/apt.conf.d/99playwright-archives >/dev/null
          if ! pnpm exec playwright install --with-deps webkit chromium; then
            test "$PLAYWRIGHT_CACHE_HIT" = true
            sudo dpkg -i "$HOME"/.cache/playwright-apt/*.deb
            pnpm exec playwright install webkit chromium
          fi
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/playwright-apt"

      - name: Save Playwright browsers and system packages
        if: steps.image.outputs.ready != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run mobile shell tests
        id: mobile-shell
        env:
          BROWSER_GATES_IMAGE_READY: ${{ steps.image.outputs.ready }}
        run: bash scripts/ci-browser-gate.sh tests/mobile-shell/playwright.config.ts

      - name: Run contrast gate
        if: ${{ !cancelled() }}
        env:
          BROWSER_GATES_IMAGE_READY: ${{ steps.image.outputs.ready }}
        run: bash scripts/ci-browser-gate.sh tests/contrast-gate/playwright.config.ts

      - name: Upload mobile shell Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.mobile-shell.outcome == 'failure' }}
        with:
          name: mobile-shell-test-results
          path: tests/mobile-shell/test-results/
          retention-days: 7

      - name: Upload contrast report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contrast-gate-report
          path: tests/contrast-gate/test-results/
          retention-days: 14

  upgrade-path:
    name: Upgrade path (published release to this commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          store: "true"
      - name: Runner Rust release cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages/wardmote-runner/runner -> target
          shared-key: runner-build-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
      - name: Upgrade an existing install to this commit and keep its home
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/wardmote-runner/runner/target
          GH_TOKEN: ${{ github.token }}
          UPGRADE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          UPGRADE_SHA: ${{ github.event.pull_request.head.sha }}
        run: UPGRADE_PNPM_STORE="$(pnpm store path --silent)" bash scripts/test-upgrade-path.sh

  verify:
    name: verify
    if: always()
    needs: [policy, typecheck, build, runner, general, serialized, runner-e2e-unit, e2e, browser-gates, upgrade-path]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-timing-report.mjs
            .github/ci-budgets.json
          sparse-checkout-cone-mode: false
      - name: Report CI time against the budget
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-timing-report.mjs --run "${{ github.run_id }}" --budget .github/ci-budgets.json
      - name: Fail if any lane failed
        env:
          RESULTS: ${{ toJSON(needs) }}
          PULL_REQUEST_ONLY_LANES: ${{ github.event_name == 'pull_request' && '[]' || '["upgrade-path"]' }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed="$(jq -r '(env.PULL_REQUEST_ONLY_LANES | fromjson) as $pr_only | to_entries | map(select(.value.result != "success" and (.value.result != "skipped" or (.key as $k | $pr_only | any(. == $k) | not))) | .key + "=" + .value.result) | join(" ")' <<<"$RESULTS")"
          if [ -n "$failed" ]; then
            echo "lanes that did not succeed: $failed"
            exit 1
          fi
          echo "every lane ran and succeeded"
