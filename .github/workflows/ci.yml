name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zeroes="0000000000000000000000000000000000000000"
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA")"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zeroes" ]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse --verify --quiet "${HEAD_SHA}^" || true)"
          fi

          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "comparing $base..$HEAD_SHA"
            files="$(git diff --name-only "$base" "$HEAD_SHA")"
          else
            echo "::notice title=Docs fast lane::no usable base commit; running the full lane"
            files="$(git ls-files)"
          fi

          docs_only=true
          count=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            count=$((count + 1))
            echo "changed: $file"
            case "$file" in
              *.md) continue ;;
              LICENSE) continue ;;
              docs/*) continue ;;
              doc/*) continue ;;
              .github/ISSUE_TEMPLATE/*) continue ;;
              .github/PULL_REQUEST_TEMPLATE.md) continue ;;
              .github/PULL_REQUEST_TEMPLATE/*) continue ;;
            esac
            docs_only=false
          done <<< "$files"

          echo "changed files: $count"
          echo "docs_only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  policy:
    name: Policy, browser extensions, Docker OMP pin
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/policy-checks

      - name: Check the bundled OMP matches the pin
        if: ${{ !cancelled() }}
        run: bash scripts/check-docker-omp-pin.sh Dockerfile

      - name: Check the shared protocol contract is current
        if: ${{ !cancelled() }}
        run: node scripts/generate-local-browser-protocol.mjs --check
      - name: Check the synced extension copies match apps/local-browser/shared
        if: ${{ !cancelled() }}
        run: node scripts/sync-local-browser-shared.mjs --check
      - name: Check every extension script parses
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          find apps/local-browser -name '*.js' -o -name '*.mjs' | while read -r file; do
            node --check "$file"
          done
      - name: Run the extension suites
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test apps/local-browser/shared/lib/*.test.mjs
          node --test apps/local-browser/chromium/lib/*.test.mjs apps/local-browser/chromium/background/*.test.mjs
          node --test apps/local-browser/firefox/lib/*.test.mjs
      - name: Check the download artifacts match the source
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/check-local-browser-artifacts.mjs
          test -s ui/public/downloads/local-browser-firefox.xpi || {
            echo "ui/public/downloads/local-browser-firefox.xpi is missing."
            exit 1
          }
          unzip -p ui/public/downloads/local-browser-firefox.xpi manifest.json > /dev/null || {
            echo "ui/public/downloads/local-browser-firefox.xpi is not a readable add-on."
            exit 1
          }

  typecheck:
    name: Typecheck
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Runner Rust release cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: runner-typecheck-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Typecheck workspaces whose build scripts skip TypeScript
        run: pnpm run typecheck:build-gaps

  build:
    name: Build
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          save-store: "true"
      - name: Build Runner Evalbook viewer
        run: pnpm --filter @tickernelz/wardmote-paperclip-runner build:issue-thread
      - name: Runner Rust release cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: runner-build-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build
        run: pnpm build

  runner:
    name: Verify Paperclip Runner (${{ matrix.part }})
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [checks, suites]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Select the pinned Runner Rust toolchain
        working-directory: packages/paperclip-runner
        run: |
          set -uo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo '::notice title=Runner Rust cache::rustup is unavailable; building with the image default toolchain'
            exit 0
          fi
          rustup show
          toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          extra_toolchains="$(rustup toolchain list | awk '{print $1}' | grep -vx "$toolchain" || true)"
          if [ -n "$extra_toolchains" ]; then
            echo "$extra_toolchains" | xargs -n1 rustup toolchain uninstall \
              || echo '::notice title=Runner Rust cache::could not remove an extra toolchain; the cache key may not match'
          fi
          rustup toolchain list

      - name: Runner Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: runner-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Static checks
        if: matrix.part == 'checks'
        run: pnpm --filter @tickernelz/wardmote-paperclip-runner check:static

      - name: Rust checks
        if: matrix.part == 'checks'
        run: pnpm --filter @tickernelz/wardmote-paperclip-runner check:runner

      - name: TypeScript suites
        if: matrix.part == 'suites'
        run: pnpm --filter @tickernelz/wardmote-paperclip-runner test:typescript:vitest

  general:
    name: Tests (${{ matrix.label }})
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: general-server-without-chat
            label: server 1/6
            shard_index: 0
            shard_count: 6
          - group: general-server-without-chat
            label: server 2/6
            shard_index: 1
            shard_count: 6
          - group: general-server-without-chat
            label: server 3/6
            shard_index: 2
            shard_count: 6
          - group: general-server-without-chat
            label: server 4/6
            shard_index: 3
            shard_count: 6
          - group: general-server-without-chat
            label: server 5/6
            shard_index: 4
            shard_count: 6
          - group: general-server-without-chat
            label: server 6/6
            shard_index: 5
            shard_count: 6
          - group: general-chat
            label: chat 1/2
            shard_index: 0
            shard_count: 2
          - group: general-chat
            label: chat 2/2
            shard_index: 1
            shard_count: 2
          - group: general-workspaces-a
            label: workspaces-a 1/2
            shard_index: 0
            shard_count: 2
          - group: general-workspaces-a
            label: workspaces-a 2/2
            shard_index: 1
            shard_count: 2
          - group: general-workspaces-b
            label: workspaces-b
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Run grouped test suites
        env:
          WARDMOTE_SERVER_TEST_WORKERS: "3"
        run: |
          echo "runner: $(nproc) CPU, $(free -g | awk '/^Mem:/ {print $2}') GiB RAM"
          if [ -n "${{ matrix.shard_count }}" ]; then
            pnpm test:run:general -- --group '${{ matrix.group }}' \
              --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general -- --group '${{ matrix.group }}'
          fi

  serialized:
    name: Tests (serialized ${{ matrix.shard_index }}/3)
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Run serialized server test shard
        env:
          WARDMOTE_SERVER_TEST_WORKERS: "3"
        run: pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count 3

  e2e:
    name: E2E (${{ matrix.shard_index }}/4)
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Verify runner Chrome
        run: google-chrome --version

      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip-pro/instances/default
          cat > ~/.paperclip-pro/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_SKIP_LLM: "true"
          PAPERCLIP_PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          specs="$(node ./scripts/e2e-shard.mjs --shard-index ${{ matrix.shard_index }} --shard-count 4)"
          echo "shard ${{ matrix.shard_index }} specs: $specs"
          # shellcheck disable=SC2086
          pnpm run test:e2e $specs

      - name: Upload onboarding screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: onboarding-shots-${{ matrix.shard_index }}
          path: tests/e2e/test-results/onboarding-shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard_index }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

  browser-gates:
    name: Mobile shell (WebKit) and contrast gate (rendered colours)
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Install WebKit and Chromium
        run: pnpm exec playwright install --with-deps webkit chromium

      - name: Run mobile shell tests
        id: mobile-shell
        run: pnpm exec playwright test --config tests/mobile-shell/playwright.config.ts

      - name: Run contrast gate
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test --config tests/contrast-gate/playwright.config.ts

      - name: Upload mobile shell Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.mobile-shell.outcome == 'failure' }}
        with:
          name: mobile-shell-test-results
          path: tests/mobile-shell/test-results/
          retention-days: 7

      - name: Upload contrast report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contrast-gate-report
          path: tests/contrast-gate/test-results/
          retention-days: 14

  upgrade-path:
    name: Upgrade path (published release to this commit)
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Runner Rust release cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: runner-build-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
      - name: Upgrade an existing install to this commit and keep its home
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/paperclip-runner/runner/target
          GH_TOKEN: ${{ github.token }}
          UPGRADE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          UPGRADE_SHA: ${{ github.event.pull_request.head.sha }}
        run: UPGRADE_PNPM_STORE="$(pnpm store path --silent)" bash scripts/test-upgrade-path.sh

  docs:
    name: Docs
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/policy-checks

      - name: Run the documentation-reading test suites
        run: pnpm test:run:docs

  verify:
    name: verify
    if: always()
    needs: [scope, policy, docs, typecheck, build, runner, general, serialized, e2e, browser-gates, upgrade-path]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-timing-report.mjs
            .github/ci-budgets.json
          sparse-checkout-cone-mode: false
      - name: Report CI time against the budget
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-timing-report.mjs --run "${{ github.run_id }}" --budget .github/ci-budgets.json
      - name: Fail if any lane failed
        env:
          RESULTS: ${{ toJSON(needs) }}
          PULL_REQUEST_ONLY_LANES: ${{ github.event_name == 'pull_request' && '[]' || '["upgrade-path"]' }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed="$(jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped") | .key + "=" + .value.result) | join(" ")' <<<"$RESULTS")"
          if [ -n "$failed" ]; then
            echo "failed lanes: $failed"
            exit 1
          fi

          docs="$(jq -r '.docs.result' <<<"$RESULTS")"
          heavy_lanes='(env.PULL_REQUEST_ONLY_LANES | fromjson) as $pr_only | [to_entries[] | select(.key != "scope" and .key != "docs" and (.key as $k | $pr_only | any(. == $k) | not))]'
          skipped_heavy="$(jq -r "$heavy_lanes | map(select(.value.result == \"skipped\")) | length" <<<"$RESULTS")"
          heavy_total="$(jq -r "$heavy_lanes | length" <<<"$RESULTS")"

          if [ "$docs" = "success" ] && [ "$skipped_heavy" -eq "$heavy_total" ]; then
            echo "docs-only lane: all $heavy_total heavy lanes skipped, Docs green"
            exit 0
          fi

          if [ "$docs" = "skipped" ] && [ "$skipped_heavy" -eq 0 ]; then
            echo "full lane: every heavy lane ran and succeeded"
            exit 0
          fi

          echo "inconsistent lane outcome: docs=$docs skipped-heavy=$skipped_heavy/$heavy_total"
          exit 1
