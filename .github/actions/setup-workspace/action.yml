name: Setup workspace
description: Install Node, pnpm and the workspace dependencies from the main-branch node_modules cache, falling back to the shared pnpm store.

inputs:
  save-store:
    description: Persist the dependency caches when running on the default branch.
    required: false
    default: "false"
  store:
    description: Restore the pnpm store even when node_modules comes from the cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      env:
        NPM_CONFIG_AUDIT: "false"
        NPM_CONFIG_FUND: "false"
        NPM_CONFIG_UPDATE_NOTIFIER: "false"
      with:
        version: 9.15.4
        run_install: false

    - name: Locate pnpm store
      id: store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

    - name: Restore node_modules
      id: modules
      uses: actions/cache/restore@v5
      with:
        path: |
          node_modules
          */node_modules
          packages/*/node_modules
          packages/*/*/node_modules
          packages/plugins/*/*/node_modules
        key: modules-${{ runner.os }}-${{ steps.store.outputs.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'patches/**', '**/package.json', '.github/actions/setup-workspace/action.yml') }}

    - name: Restore pnpm store
      id: pnpm-store
      if: steps.modules.outputs.cache-hit != 'true' || inputs.store == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ steps.store.outputs.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-${{ steps.store.outputs.arch }}-

    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if ! pnpm install --frozen-lockfile; then
          echo '::notice title=Lockfile::checked-in lockfile is stale for this tree; resolving it inline'
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile
        fi

    - name: Run the root postinstall over the restored node_modules
      if: steps.modules.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm run --if-present postinstall

    - name: Save node_modules
      if: ${{ inputs.save-store == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.modules.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: |
          node_modules
          */node_modules
          packages/*/node_modules
          packages/*/*/node_modules
          packages/plugins/*/*/node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}

    - name: Prune the pnpm store to this lockfile
      if: ${{ inputs.save-store == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.modules.outputs.cache-hit != 'true' && steps.pnpm-store.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm store prune

    - name: Save pnpm store
      if: ${{ inputs.save-store == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.modules.outputs.cache-hit != 'true' && steps.pnpm-store.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ steps.store.outputs.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
