<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paperclip Local Browser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Paperclip Local Browser</h1>
      <span id="status" class="pill">unpaired</span>
    </header>

    <section id="details" class="card">
      <dl>
        <dt>Label</dt>
        <dd id="label">&mdash;</dd>
        <dt>Tier</dt>
        <dd id="tier">&mdash;</dd>
        <dt>Origin</dt>
        <dd id="origin">&mdash;</dd>
        <dt>Connected</dt>
        <dd id="since">&mdash;</dd>
        <dt>Client</dt>
        <dd id="version">&mdash;</dd>
        <dt>Trusted input</dt>
        <dd id="bidi">checking</dd>
      </dl>
    </section>

    <section id="pair-form" class="card">
      <h2>Connect this browser</h2>
      <p id="detected" class="hint" hidden></p>
      <label>
        Pairing link or code
        <input id="pair-input" type="text" placeholder="Paste the link from Paperclip" autocomplete="off" spellcheck="false" />
      </label>
      <button id="pair" type="button">Connect</button>
      <p class="hint">
        Paste the pairing link from the Local Browser page, or type the 8 character code if this
        browser has connected before.
      </p>
    </section>

    <section id="actions" class="card">
      <button id="reconnect" type="button" class="ghost">Reconnect</button>
      <button id="disconnect" type="button" class="danger">Disconnect</button>
    </section>

    <p id="message" class="message" hidden></p>
    <p id="bidi-hint" class="hint" hidden></p>

    <script src="../lib/protocol.js"></script>
    <script src="../lib/pairing.js"></script>
    <script src="../lib/popup-state.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
